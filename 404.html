<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No such world. Hamdan Esmail</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#c6162d">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  grid-template-rows: 1fr auto;
  padding: 18px 32px 22px;
  background: #c6162d;
  color: #ffffff;
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  font-size: clamp(1.0625rem, 1rem + 0.25vw, 1.1875rem);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 0 -0.04em; font-size: 13vw; font-weight: 600; letter-spacing: -0.055em; line-height: 0.85; }
p { margin: 28px 0 24px; max-width: 34ch; font-size: clamp(1.375rem, 1.1rem + 0.9vw, 1.875rem); font-weight: 500; letter-spacing: -0.02em; line-height: 1.2; }
a.btn { display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; background: #ffffff; color: #c6162d; font-weight: 500; text-decoration: none; transition: transform 140ms cubic-bezier(0.22, 1, 0.36, 1); }
a.btn:hover { transform: translateY(-2px); }
a.btn:focus-visible { outline: 3px solid #ffffff; outline-offset: 3px; }
footer { font-size: 0.9375rem; }
@media (max-width: 860px) { body { padding: 12px 16px 14px; } h1 { font-size: 21vw; } }
</style>
</head>
<body>
<main>
  <h1>No such<br>world.</h1>
  <p>There are nine worlds here and this address is not one of them.</p>
  <a class="btn" href="/">Back to the nine</a>
</main>
<footer>Built by Hamdan Esmail</footer>
</body>
</html>
